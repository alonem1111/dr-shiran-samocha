# Publish the static site; Functions live in netlify/functions
[build]
  publish = "static"
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  node_version = "20"

[[redirects]]
  from = "/booking"
  to = "/booking/"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
