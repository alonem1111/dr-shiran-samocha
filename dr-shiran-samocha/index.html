  <body>
    <div id="root"></div>

    <!-- Netlify form detection (the real forms are rendered by React) -->
    <form name="booking" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="שם מלא" />
      <input type="tel" name="טלפון" />
      <input type="text" name="טיפול מבוקש" />
      <input type="text" name="זמן מועדף" />
      <textarea name="הערות"></textarea>
      <input type="hidden" name="subject" />
      <input name="bot-field" />
    </form>
    <form name="reviews" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <textarea name="review"></textarea>
      <input name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
